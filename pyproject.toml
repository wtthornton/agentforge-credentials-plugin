[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-credentials-plugin"
version = "1.0.0"
description = "Test rig for AgentForge credential vault resolution (TAP-764)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
]

[project.entry-points."agentforge.plugins"]
credentials-test = "agentforge_credentials"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_credentials"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_credentials/plugin.json" = "agentforge_credentials/plugin.json"
"agentforge_credentials/agents/credentials_test_agent/AGENT.md" = "agentforge_credentials/agents/credentials_test_agent/AGENT.md"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
